<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Pool</title>
  <style>
    :root {
      --bg:         #f0f2f0;
      --surface:    #ffffff;
      --primary:    #1a472a;
      --primary-lt: #2d6a42;
      --accent:     #ffd700;
      --text:       #1a1a1a;
      --muted:      #666666;
      --border:     #d8dbd8;
      --win:        #c8f0d0;
      --win-text:   #1a6b30;
      --shadow:     0 2px 8px rgba(0,0,0,0.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--primary);
      color: #fff;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: var(--shadow);
    }
    header .ball { font-size: 1.6rem; }
    header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.02em; }

    /* ── Tab nav ── */
    nav#tab-nav {
      background: var(--primary);
      display: flex;
      border-top: 1px solid var(--primary-lt);
    }
    .tab-btn {
      flex: 1;
      padding: 0.7rem 0.5rem;
      background: none;
      border: none;
      color: rgba(255,255,255,0.65);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover  { color: #fff; }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Main content ── */
    main { padding: 1.25rem 1rem; max-width: 1100px; margin: 0 auto; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 1rem; color: var(--primary); }
    h3 { font-size: 1rem; font-weight: 600; margin: 1.25rem 0 0.5rem; color: var(--primary); }

    /* ── Tables ── */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
      font-size: 0.88rem;
    }
    .data-table th {
      background: var(--primary);
      color: #fff;
      padding: 0.6rem 0.75rem;
      text-align: left;
      font-weight: 600;
      white-space: nowrap;
    }
    .data-table td {
      padding: 0.55rem 0.75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .data-table tbody tr:nth-child(even) { background: #f7f9f7; }
    .data-table tbody tr:hover { background: #edf3ee; }

    .pts { font-weight: 700; text-align: right; }
    .pts-positive { background: var(--win) !important; color: var(--win-text); font-weight: 700; }
    .rank-medal { font-weight: 800; font-size: 1rem; }

    /* ── Player link buttons ── */
    .player-link {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      font-size: inherit;
      padding: 0;
      text-decoration: underline dotted;
      text-underline-offset: 2px;
    }
    .player-link:hover { color: var(--primary-lt); }

    /* ── Matches tab ── */
    details {
      background: var(--surface);
      border-radius: 8px;
      box-shadow: var(--shadow);
      margin-bottom: 1rem;
      overflow: hidden;
    }
    details > summary {
      padding: 0.75rem 1rem;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      user-select: none;
    }
    details > summary::before {
      content: "▶";
      font-size: 0.7rem;
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    details[open] > summary::before { transform: rotate(90deg); }
    details > summary .badge {
      font-size: 0.75rem;
      font-weight: 500;
      opacity: 0.75;
    }

    .game-card {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .game-card:last-child { border-bottom: none; }
    .game-card h4 {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: var(--primary);
    }

    .pred-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .pred-table th {
      background: #e8f0e9;
      color: var(--primary);
      padding: 0.35rem 0.6rem;
      text-align: center;
      font-weight: 600;
      white-space: nowrap;
    }
    .pred-table td {
      padding: 0.35rem 0.6rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .pred-table tbody tr:last-child td { border-bottom: none; }
    .real-score { font-weight: 700; background: #f0f7f1; }
    .not-played { color: var(--muted); font-style: italic; }

    /* ── Stages tab ── */
    .stage-block {
      background: var(--surface);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .stage-block h3 { margin-top: 0; }
    .team-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }
    .team-chip {
      background: #e8f0e9;
      color: var(--primary);
      border: 1px solid #b8d4bc;
      border-radius: 20px;
      padding: 0.3rem 0.75rem;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .stage-not-started {
      color: var(--muted);
      font-style: italic;
      font-size: 0.88rem;
    }

    /* ── Players tab ── */
    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 1rem;
    }
    .player-card {
      background: var(--surface);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 1rem 1.1rem;
      border-top: 4px solid var(--primary);
    }
    .player-card h3 { margin: 0 0 0.5rem; font-size: 0.95rem; }
    .player-card p { font-size: 0.85rem; color: var(--muted); margin-top: 0.25rem; }
    .player-card p strong { color: var(--text); }
    .badge-win {
      display: inline-block;
      background: var(--win);
      color: var(--win-text);
      border-radius: 10px;
      padding: 0 0.4rem;
      font-size: 0.78rem;
      font-weight: 700;
      margin-left: 0.3rem;
    }

    /* ── Modal ── */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
      z-index: 100;
      overflow-y: auto;
    }
    .modal.hidden { display: none; }
    .modal-box {
      background: var(--surface);
      border-radius: 10px;
      width: 100%;
      max-width: 920px;
      padding: 1.5rem;
      position: relative;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      width: 2rem;
      height: 2rem;
      font-size: 1rem;
      cursor: pointer;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close:hover { background: var(--bg); color: var(--text); }

    .modal-header { margin-bottom: 1rem; padding-right: 2.5rem; }
    .modal-header h2 { margin-bottom: 0.3rem; }
    .modal-meta { font-size: 0.88rem; color: var(--muted); }
    .modal-meta strong { color: var(--text); }

    .stage-pts {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-left: 0.5rem;
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
      font-size: 1rem;
    }
    .error {
      text-align: center;
      padding: 2rem;
      color: #c0392b;
      background: #fdf0ee;
      border-radius: 8px;
      margin: 1rem 0;
    }
  </style>
</head>
<body>

<header>
  <span class="ball">⚽</span>
  <h1 id="tournament-name">Cargando...</h1>
</header>

<nav id="tab-nav">
  <button class="tab-btn active" data-tab="ranking">Tabla</button>
  <button class="tab-btn" data-tab="matches">Partidos</button>
  <button class="tab-btn" data-tab="stages">Fases</button>
  <button class="tab-btn" data-tab="players">Jugadores</button>
</nav>

<main>
  <section id="tab-ranking"  class="tab-panel active"><div class="loading">Cargando datos...</div></section>
  <section id="tab-matches"  class="tab-panel"></section>
  <section id="tab-stages"   class="tab-panel"></section>
  <section id="tab-players"  class="tab-panel"></section>
</main>

<div id="player-modal" class="modal hidden">
  <div class="modal-box">
    <button class="modal-close" id="modal-close-btn" aria-label="Cerrar">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
  // ── Module-level state ──────────────────────────────────────────────
  let appPlayers = [];

  // ── Helpers ────────────────────────────────────────────────────────
  function formatStageName(nid) {
    const names = {
      groups:      'Fase de Grupos',
      top_16:      'Octavos de Final',
      top_8:       'Cuartos de Final',
      top_4:       'Semifinales',
      finals:      'Final',
      third_place: 'Tercer Puesto'
    };
    return names[nid] || nid.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  function fmtScore(local, visit) {
    if (local === null || local === undefined || visit === null || visit === undefined) return null;
    return `${local} - ${visit}`;
  }

  // ── Tab switching ───────────────────────────────────────────────────
  function setupTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });
  }

  // ── View 1: Rankings ────────────────────────────────────────────────
  function renderRanking(ranking) {
    const panel = document.getElementById('tab-ranking');
    let html = '<h2>Tabla de Posiciones</h2>';
    html += '<table class="data-table"><thead><tr><th>#</th><th>Jugador</th><th>Puntos</th></tr></thead><tbody>';

    for (const row of ranking) {
      const medal = row.rank === 1 ? '🥇' : row.rank === 2 ? '🥈' : row.rank === 3 ? '🥉' : row.rank;
      html += `<tr>
        <td class="rank-medal">${medal}</td>
        <td><button class="player-link" data-name="${esc(row.name)}">${esc(row.name)}</button></td>
        <td class="pts">${row.points}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    panel.innerHTML = html;
  }

  // ── View 2: Matches ─────────────────────────────────────────────────
  function renderMatches(stages, ranking) {
    const panel = document.getElementById('tab-matches');
    const playerNames = ranking.map(r => r.name);

    let html = '<h2>Resultados y Predicciones</h2>';

    for (const stage of stages) {
      const label = formatStageName(stage.nid);
      const badge = stage.finished ? 'Finalizada' : stage.started ? 'En curso' : 'No iniciada';
      const openAttr = stage.order > 1 ? ' open' : '';

      html += `<details${openAttr}>
        <summary>${label} <span class="badge">${badge}</span></summary>`;

      for (const game of stage.games) {
        if (!game.local_team && !game.visit_team) continue;

        const local  = game.local_team  || '?';
        const visit  = game.visit_team  || '?';
        const realStr = fmtScore(game.local_score, game.visit_score)
          || '<span class="not-played">Por jugar</span>';

        html += `<div class="game-card">
          <h4>Partido ${game.id}: ${esc(local)} vs ${esc(visit)}</h4>
          <table class="pred-table"><thead><tr>
            <th>Resultado Real</th>`;

        for (const name of playerNames) {
          html += `<th>${esc(name)}</th>`;
        }
        html += '</tr></thead><tbody><tr>';
        html += `<td class="real-score">${realStr}</td>`;

        for (const name of playerNames) {
          const pred = game.predictions.find(p => p.player_name === name);
          if (!pred) { html += '<td>-</td>'; continue; }
          const score = fmtScore(pred.local_score, pred.visit_score) || '-';
          const cls   = pred.points_earned > 0 ? ' class="pts-positive"' : '';
          html += `<td${cls}>${score}</td>`;
        }
        html += '</tr></tbody></table></div>';
      }
      html += '</details>';
    }
    panel.innerHTML = html;
  }

  // ── View 3: Stage progression ───────────────────────────────────────
  function renderStages(stages) {
    const panel = document.getElementById('tab-stages');
    const knockoutNids = ['top_16', 'top_8', 'top_4', 'finals', 'third_place'];
    const knockout = stages
      .filter(s => knockoutNids.includes(s.nid))
      .sort((a, b) => a.order - b.order);

    let html = '<h2>Progresión de Fases</h2>';

    for (const stage of knockout) {
      html += `<div class="stage-block"><h3>${formatStageName(stage.nid)}</h3>`;
      if (!stage.started) {
        html += '<p class="stage-not-started">Aún no iniciada</p>';
      } else {
        const teams = new Set();
        for (const game of stage.games) {
          if (game.local_team)  teams.add(game.local_team);
          if (game.visit_team)  teams.add(game.visit_team);
        }
        html += '<div class="team-grid">';
        for (const team of [...teams].sort()) {
          html += `<div class="team-chip">${esc(team)}</div>`;
        }
        html += '</div>';
      }
      html += '</div>';
    }
    panel.innerHTML = html;
  }

  // ── View 4: Players list ────────────────────────────────────────────
  function renderPlayers(players, ranking) {
    const panel = document.getElementById('tab-players');
    const rankMap = Object.fromEntries(ranking.map(r => [r.name, r.rank]));

    let html = '<h2>Jugadores</h2><div class="player-grid">';
    const sorted = [...players].sort((a, b) => b.total_points - a.total_points);

    for (const p of sorted) {
      const champBadge = p.champion_points > 0
        ? `<span class="badge-win">+${p.champion_points} pts</span>` : '';
      html += `<div class="player-card">
        <h3><button class="player-link" data-name="${esc(p.name)}">${esc(p.name)}</button></h3>
        <p>Posición: <strong>#${rankMap[p.name] ?? '—'}</strong></p>
        <p>Puntos: <strong>${p.total_points}</strong></p>
        <p>Campeón: <strong>${esc(p.champion_pick || '—')}</strong>${champBadge}</p>
      </div>`;
    }
    html += '</div>';
    panel.innerHTML = html;
  }

  // ── Player detail modal ─────────────────────────────────────────────
  function openPlayerModal(playerName) {
    const player = appPlayers.find(p => p.name === playerName);
    if (!player) return;

    let html = `<div class="modal-header">
      <h2>${esc(player.name)}</h2>
      <div class="modal-meta">
        Total: <strong>${player.total_points} pts</strong> &nbsp;|&nbsp;
        Campeón: <strong>${esc(player.champion_pick || '—')}</strong>
        ${player.champion_points > 0 ? `<span class="badge-win">+${player.champion_points} pts</span>` : ''}
      </div>
    </div>`;

    for (const stage of player.stages) {
      const stagePts = stage.stage_points > 0
        ? `${stage.stage_points} pts clasificación` : '';
      html += `<h3>${formatStageName(stage.nid)}
        ${stagePts ? `<span class="stage-pts">${stagePts}</span>` : ''}
      </h3>`;
      html += `<table class="data-table" style="margin-bottom:0.75rem">
        <thead><tr>
          <th>#</th><th>Resultado Real</th><th>Tu Predicción</th><th>Pts</th>
        </tr></thead><tbody>`;

      for (const g of stage.games) {
        const realStr = g.real_local
          ? (fmtScore(g.real_local_score, g.real_visit_score)
              ? `${esc(g.real_local)} ${g.real_local_score}-${g.real_visit_score} ${esc(g.real_visit)}`
              : `${esc(g.real_local)} vs ${esc(g.real_visit)}`)
          : '—';
        const predStr = g.pred_local
          ? `${esc(g.pred_local)} ${g.pred_local_score ?? '?'}-${g.pred_visit_score ?? '?'} ${esc(g.pred_visit)}`
          : '—';
        const ptsCls = g.points_earned > 0 ? 'pts-positive' : '';

        html += `<tr>
          <td>${g.game_id}</td>
          <td>${realStr}</td>
          <td>${predStr}</td>
          <td class="pts ${ptsCls}">${g.points_earned}</td>
        </tr>`;
      }
      html += '</tbody></table>';
    }

    document.getElementById('modal-content').innerHTML = html;
    document.getElementById('player-modal').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }

  function closePlayerModal() {
    document.getElementById('player-modal').classList.add('hidden');
    document.body.style.overflow = '';
  }

  // ── Event delegation ────────────────────────────────────────────────
  function setupEvents() {
    document.body.addEventListener('click', e => {
      const btn = e.target.closest('.player-link');
      if (btn) { openPlayerModal(btn.dataset.name); return; }

      if (e.target.id === 'modal-close-btn' || e.target.id === 'player-modal') {
        closePlayerModal();
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closePlayerModal();
    });
  }

  // ── HTML escape ─────────────────────────────────────────────────────
  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Bootstrap ───────────────────────────────────────────────────────
  async function fetchData() {
    if (window.__DATA__) { initApp(window.__DATA__); return; }
    try {
      const resp = await fetch('./data.json');
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      initApp(data);
    } catch (err) {
      document.getElementById('tab-ranking').innerHTML =
        `<div class="error">Error al cargar data.json: ${err.message}<br>
        Asegúrate de ejecutar <code>python web.py --instance "Nombre"</code> primero.</div>`;
    }
  }

  function initApp(data) {
    appPlayers = data.players;

    document.title = data.tournament_name + ' — Pool';
    document.getElementById('tournament-name').textContent = data.tournament_name;

    renderRanking(data.ranking);
    renderMatches(data.stages, data.ranking);
    renderStages(data.stages);
    renderPlayers(data.players, data.ranking);

    setupTabs();
    setupEvents();
  }

  fetchData();
